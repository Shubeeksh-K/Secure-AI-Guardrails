[project]
name = "secure-ai"
version = "0.1.0"
description = "A defense-in-depth Google ADK commerce agent evaluated with Respan AI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
keywords = ["ai-security", "google-adk", "llm", "prompt-injection", "respan"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "google-adk[extensions]>=2.0.0,<3.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "python-dotenv>=1.2.0,<2.0.0",
  "respan-ai>=4.0.0,<5.0.0",
  "respan-instrumentation-google-adk>=0.1.0,<1.0.0",
]

[project.scripts]
secure-ai = "secure_ai.cli:main"

[project.urls]
Repository = "https://github.com/Shubeeksh-K/Secure-AI-Guardrails"
Issues = "https://github.com/Shubeeksh-K/Secure-AI-Guardrails/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["secure_ai*"]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "respan-redteam>=0.1.7",
  "ruff>=0.12.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
